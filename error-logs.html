<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error Logs - Admin Dashboard</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .log-header {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 30px 20px;
            margin: -20px -20px 20px -20px;
        }
        
        .log-header h1 {
            margin: 0 0 10px 0;
            color: white;
        }
        
        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .filter-bar select {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            flex: 1;
            min-width: 150px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 14px;
            color: #666;
        }
        
        .critical { color: #e74c3c; }
        .high { color: #e67e22; }
        .medium { color: #f39c12; }
        .low { color: #3498db; }
        
        .error-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-left: 5px solid #ccc;
        }
        
        .error-card.critical { border-left-color: #e74c3c; }
        .error-card.high { border-left-color: #e67e22; }
        .error-card.medium { border-left-color: #f39c12; }
        .error-card.low { border-left-color: #3498db; }
        
        .error-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }
        
        .error-type {
            font-weight: 700;
            font-size: 16px;
            color: #333;
        }
        
        .error-time {
            font-size: 13px;
            color: #999;
        }
        
        .error-message {
            margin: 10px 0;
            color: #666;
        }
        
        .error-details {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }
        
        .error-details.show {
            display: block;
        }
        
        .error-actions {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }
        
        .error-actions button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }
        
        .btn-resolve {
            background: #27ae60;
            color: white;
        }
        
        .btn-details {
            background: #3498db;
            color: white;
        }
        
        .severity-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 10px;
        }
        
        .badge-critical { background: #ffe0e0; color: #e74c3c; }
        .badge-high { background: #ffe8d9; color: #e67e22; }
        .badge-medium { background: #fff4e0; color: #f39c12; }
        .badge-low { background: #d9edf7; color: #3498db; }
    </style>
</head>
<body>
    <div class="container">
        <button class="btn btn-back" onclick="navigateTo('index.html')">← Back to Home</button>
        
        <div class="log-header">
            <h1>⚠️ Error Logs</h1>
            <p>Monitor and resolve system errors</p>
        </div>
        
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-value critical" id="criticalCount">0</div>
                <div class="stat-label">Critical Errors</div>
            </div>
            <div class="stat-card">
                <div class="stat-value high" id="highCount">0</div>
                <div class="stat-label">High Priority</div>
            </div>
            <div class="stat-card">
                <div class="stat-value medium" id="mediumCount">0</div>
                <div class="stat-label">Medium Priority</div>
            </div>
            <div class="stat-card">
                <div class="stat-value low" id="lowCount">0</div>
                <div class="stat-label">Low Priority</div>
            </div>
        </div>
        
        <div class="filter-bar">
            <select id="statusFilter" onchange="loadErrors()">
                <option value="unresolved">Unresolved</option>
                <option value="resolved">Resolved</option>
                <option value="all">All</option>
            </select>
            <select id="severityFilter" onchange="loadErrors()">
                <option value="">All Severities</option>
                <option value="critical">Critical</option>
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
            </select>
        </div>
        
        <div id="errorList">
            <div class="loading">Loading error logs...</div>
        </div>
    </div>
    
    <script src="assets/js/app.js"></script>
    <script>
        function loadErrors() {
            const status = document.getElementById('statusFilter').value;
            const severity = document.getElementById('severityFilter').value;
            
            let url = 'api/error-logs.php?status=' + status;
            if (severity) url += '&severity=' + severity;
            
            ajax(url, 'GET', null, function(err, response) {
                if (err || !response.success) {
                    document.getElementById('errorList').innerHTML = '<p>Error loading logs</p>';
                    return;
                }
                
                displayErrors(response.data);
                updateStats(response.data);
            });
        }
        
        function displayErrors(errors) {
            const list = document.getElementById('errorList');
            
            if (errors.length === 0) {
                list.innerHTML = '<p style="text-align: center; color: #999; padding: 60px;">No errors found. Great job! 🎉</p>';
                return;
            }
            
            list.innerHTML = errors.map(error => `
                <div class="error-card ${error.severity}">
                    <div class="error-header">
                        <div>
                            <span class="error-type">${error.error_type}</span>
                            <span class="severity-badge badge-${error.severity}">${error.severity.toUpperCase()}</span>
                        </div>
                        <div class="error-time">${new Date(error.created_at).toLocaleString()}</div>
                    </div>
                    <div class="error-message">${error.error_message}</div>
                    ${error.page_url ? `<div style="font-size: 12px; color: #999;">📍 ${error.page_url}</div>` : ''}
                    ${error.error_details ? `
                        <div class="error-details" id="details-${error.id}">
                            <strong>Details:</strong><br>
                            ${error.error_details}
                        </div>
                    ` : ''}
                    ${error.user_username ? `<div style="font-size: 12px; color: #999; margin-top: 5px;">👤 User: ${error.user_username}</div>` : ''}
                    ${error.client_first_name ? `<div style="font-size: 12px; color: #999;">👥 Client: ${error.client_first_name} ${error.client_last_name}</div>` : ''}
                    <div class="error-actions">
                        ${error.error_details ? `<button class="btn-details" onclick="toggleDetails(${error.id})">View Details</button>` : ''}
                        ${!error.is_resolved ? `<button class="btn-resolve" onclick="resolveError(${error.id})">Mark Resolved</button>` : '<span style="color: #27ae60; font-weight: 600;">✓ Resolved</span>'}
                    </div>
                </div>
            `).join('');
        }
        
        function toggleDetails(id) {
            const details = document.getElementById('details-' + id);
            details.classList.toggle('show');
        }
        
        function resolveError(id) {
            if (!confirm('Mark this error as resolved?')) return;
            
            const data = new URLSearchParams();
            data.append('id', id);
            data.append('resolved_by', 1); // TODO: Use actual user ID from session
            
            ajax('api/error-logs.php', 'PUT', data.toString(), function(err, response) {
                if (err || !response.success) {
                    showAlert('Failed to resolve error', 'error');
                    return;
                }
                
                showAlert('Error marked as resolved', 'success');
                loadErrors();
            });
        }
        
        function updateStats(errors) {
            const stats = {
                critical: 0,
                high: 0,
                medium: 0,
                low: 0
            };
            
            errors.forEach(error => {
                if (!error.is_resolved && stats[error.severity] !== undefined) {
                    stats[error.severity]++;
                }
            });
            
            document.getElementById('criticalCount').textContent = stats.critical;
            document.getElementById('highCount').textContent = stats.high;
            document.getElementById('mediumCount').textContent = stats.medium;
            document.getElementById('lowCount').textContent = stats.low;
        }
        
        // Auto-refresh every 30 seconds
        setInterval(loadErrors, 30000);
        
        // Initial load
        loadErrors();
    </script>
</body>
</html>
