<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product - Tweak Order Online</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="container">
        <button class="btn btn-back" onclick="navigateTo('index.html')">← Back to Home</button>
        
        <h1>Edit Product</h1>
        
        <div id="loadingMessage" class="loading">Loading product...</div>
        
        <form id="productForm" enctype="multipart/form-data" style="display: none;">
            <input type="hidden" id="productId" name="id">
            <input type="hidden" name="_method" value="PUT">
            
            <div class="form-group">
                <label for="name">Product Name *</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description"></textarea>
            </div>
            
            <div class="form-group">
                <label>Current Image</label>
                <div id="currentImage" style="margin-bottom: 10px;"></div>
            </div>
            
            <div class="form-group">
                <label for="imageOption">Update Product Image</label>
                <select id="imageOption" style="margin-bottom: 10px;">
                    <option value="keep">Keep Current Image</option>
                    <option value="upload">Upload New Image</option>
                    <option value="local">Use Local Image Path</option>
                </select>
                
                <div id="uploadOption" style="display: none;">
                    <input type="file" id="image" name="image" accept="image/*">
                </div>
                
                <div id="localOption" style="display: none;">
                    <input type="text" id="localImagePath" placeholder="e.g., images/harmreduction/naloxone.svg" style="width: 100%;">
                    <small style="color: #666;">Enter the local path to an existing image</small>
                </div>
                
                <div id="imagePreview" style="margin-top: 10px;"></div>
            </div>
            
            <div class="form-group">
                <label for="inventory">Inventory</label>
                <input type="number" id="inventory" name="inventory" value="100" min="0">
            </div>
            
            <div class="form-group">
                <label for="is_favorite">
                    <input type="checkbox" id="is_favorite" name="is_favorite" value="1">
                    Mark as Favorite
                </label>
            </div>
            
            <div class="form-group">
                <label>Background Color</label>
                <div class="color-selector" id="colorSelector">
                    <div class="color-option gradient-1" data-color="gradient-1"></div>
                    <div class="color-option gradient-2" data-color="gradient-2"></div>
                    <div class="color-option gradient-3" data-color="gradient-3"></div>
                    <div class="color-option gradient-4" data-color="gradient-4"></div>
                    <div class="color-option gradient-5" data-color="gradient-5"></div>
                    <div class="color-option gradient-6" data-color="gradient-6"></div>
                    <div class="color-option gradient-7" data-color="gradient-7"></div>
                    <div class="color-option gradient-8" data-color="gradient-8"></div>
                    <div class="color-option gradient-9" data-color="gradient-9"></div>
                    <div class="color-option gradient-10" data-color="gradient-10"></div>
                    <div class="color-option gradient-11" data-color="gradient-11"></div>
                    <div class="color-option gradient-12" data-color="gradient-12"></div>
                    <div class="color-option gradient-13" data-color="gradient-13"></div>
                    <div class="color-option gradient-14" data-color="gradient-14"></div>
                    <div class="color-option gradient-15" data-color="gradient-15"></div>
                </div>
                <input type="hidden" id="background_color" name="background_color" value="gradient-1">
            </div>
            
            <div style="display: flex; gap: 10px;">
                <button type="submit" class="btn">Update Product</button>
                <button type="button" class="btn btn-secondary" onclick="navigateTo('index.html')">Cancel</button>
            </div>
        </form>
    </div>
    
    <script src="assets/js/app.js"></script>
    <script>
        let selectedColor = 'gradient-1';
        let currentProduct = null;
        
        // Get product ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');
        
        if (!productId) {
            showAlert('No product ID provided', 'error');
            setTimeout(() => navigateTo('index.html'), 1500);
        } else {
            loadProduct(productId);
        }
        
        // Load product data
        function loadProduct(id) {
            ajax('api/products.php', 'GET', null, function(err, response) {
                if (err || !response.success) {
                    showAlert('Error loading product', 'error');
                    return;
                }
                
                const product = response.data.find(p => p.id == id);
                if (!product) {
                    showAlert('Product not found', 'error');
                    setTimeout(() => navigateTo('index.html'), 1500);
                    return;
                }
                
                currentProduct = product;
                populateForm(product);
                document.getElementById('loadingMessage').style.display = 'none';
                document.getElementById('productForm').style.display = 'block';
            });
        }
        
        // Populate form with product data
        function populateForm(product) {
            document.getElementById('productId').value = product.id;
            document.getElementById('name').value = product.name;
            document.getElementById('description').value = product.description || '';
            document.getElementById('inventory').value = product.inventory;
            document.getElementById('is_favorite').checked = product.is_favorite == 1;
            
            // Set background color
            selectedColor = product.background_color || 'gradient-1';
            document.getElementById('background_color').value = selectedColor;
            document.querySelectorAll('.color-option').forEach(option => {
                if (option.getAttribute('data-color') === selectedColor) {
                    option.classList.add('selected');
                }
            });
            
            // Show current image
            if (product.image) {
                document.getElementById('currentImage').innerHTML = 
                    `<img src="${product.image}" style="max-width: 200px; border-radius: 10px;" onerror="this.parentElement.innerHTML='<p>Image not found</p>'">
                     <p style="color: #666; font-size: 12px; margin-top: 5px;">${product.image}</p>`;
            } else {
                document.getElementById('currentImage').innerHTML = '<p style="color: #666;">No image set</p>';
            }
        }
        
        // Image option toggle
        document.getElementById('imageOption').addEventListener('change', function(e) {
            const uploadOption = document.getElementById('uploadOption');
            const localOption = document.getElementById('localOption');
            const imagePreview = document.getElementById('imagePreview');
            
            if (e.target.value === 'local') {
                uploadOption.style.display = 'none';
                localOption.style.display = 'block';
                document.getElementById('image').value = '';
            } else if (e.target.value === 'upload') {
                uploadOption.style.display = 'block';
                localOption.style.display = 'none';
                document.getElementById('localImagePath').value = '';
            } else {
                uploadOption.style.display = 'none';
                localOption.style.display = 'none';
                document.getElementById('image').value = '';
                document.getElementById('localImagePath').value = '';
            }
            imagePreview.innerHTML = '';
        });
        
        // Image upload preview
        document.getElementById('image').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('imagePreview').innerHTML = 
                        `<img src="${e.target.result}" style="max-width: 200px; border-radius: 10px;">`;
                };
                reader.readAsDataURL(file);
            }
        });
        
        // Local image path preview
        document.getElementById('localImagePath').addEventListener('input', function(e) {
            const path = e.target.value;
            if (path) {
                document.getElementById('imagePreview').innerHTML = 
                    `<img src="${path}" style="max-width: 200px; border-radius: 10px;" onerror="this.parentElement.innerHTML='<p style=color:red>Image not found</p>'">`;
            } else {
                document.getElementById('imagePreview').innerHTML = '';
            }
        });
        
        // Color selection
        document.querySelectorAll('.color-option').forEach(option => {
            option.addEventListener('click', function() {
                document.querySelectorAll('.color-option').forEach(o => o.classList.remove('selected'));
                this.classList.add('selected');
                selectedColor = this.getAttribute('data-color');
                document.getElementById('background_color').value = selectedColor;
            });
        });
        
        // Form submission
        document.getElementById('productForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const imageOption = document.getElementById('imageOption').value;
            
            // If using local image path, add it to form data
            if (imageOption === 'local') {
                const localPath = document.getElementById('localImagePath').value;
                if (localPath) {
                    formData.append('local_image_path', localPath);
                }
            }
            
            // Use POST with _method=PUT for multipart form data
            ajax('api/products.php', 'PUT', formData, function(err, response) {
                if (err) {
                    showAlert('Error updating product', 'error');
                    return;
                }
                
                if (response.success) {
                    showAlert('Product updated successfully!', 'success');
                    setTimeout(() => navigateTo('index.html'), 1500);
                } else {
                    showAlert(response.message || 'Failed to update product', 'error');
                }
            });
        });
    </script>
</body>
</html>
