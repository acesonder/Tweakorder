<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard - Tweakorder</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card.green {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .stat-card.orange {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .stat-card.blue {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .stat-value {
            font-size: 3em;
            font-weight: bold;
            margin: 10px 0;
        }

        .stat-label {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .stat-change {
            font-size: 0.9em;
            margin-top: 10px;
            opacity: 0.8;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .chart-card h3 {
            margin-top: 0;
            color: #333;
            font-size: 1.3em;
        }

        .filters {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filters select, .filters input {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
        }

        .export-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            margin-left: auto;
        }

        .export-btn:hover {
            opacity: 0.9;
        }

        .insights-section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .insight-item {
            padding: 15px;
            margin: 10px 0;
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            border-radius: 8px;
        }

        .insight-item.warning {
            border-left-color: #f5576c;
        }

        .insight-item.success {
            border-left-color: #38ef7d;
        }

        .back-btn {
            display: inline-block;
            padding: 12px 24px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .back-btn:hover {
            background: #5568d3;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <a href="index.html" class="back-btn">← Back to Home</a>
        
        <h1>📊 Analytics Dashboard</h1>

        <div class="filters">
            <select id="timeRange">
                <option value="today">Today</option>
                <option value="week" selected>This Week</option>
                <option value="month">This Month</option>
                <option value="year">This Year</option>
                <option value="all">All Time</option>
            </select>

            <input type="date" id="startDate" placeholder="Start Date">
            <input type="date" id="endDate" placeholder="End Date">

            <button class="export-btn" onclick="exportReport()">📥 Export Report</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Orders</div>
                <div class="stat-value" id="totalOrders">-</div>
                <div class="stat-change" id="ordersChange">-</div>
            </div>

            <div class="stat-card green">
                <div class="stat-label">Fulfilled Orders</div>
                <div class="stat-value" id="fulfilledOrders">-</div>
                <div class="stat-change" id="fulfilledChange">-</div>
            </div>

            <div class="stat-card orange">
                <div class="stat-label">Active Clients</div>
                <div class="stat-value" id="activeClients">-</div>
                <div class="stat-change" id="clientsChange">-</div>
            </div>

            <div class="stat-card blue">
                <div class="stat-label">Top Products</div>
                <div class="stat-value" id="topProducts">-</div>
                <div class="stat-change" id="productsChange">-</div>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-card">
                <h3>📈 Order Trends</h3>
                <canvas id="orderTrendsChart"></canvas>
            </div>

            <div class="chart-card">
                <h3>🥧 Order Status Distribution</h3>
                <canvas id="statusChart"></canvas>
            </div>

            <div class="chart-card">
                <h3>📦 Top 10 Products</h3>
                <canvas id="productsChart"></canvas>
            </div>

            <div class="chart-card">
                <h3>👥 Client Activity</h3>
                <canvas id="clientsChart"></canvas>
            </div>
        </div>

        <div class="insights-section">
            <h2>💡 Key Insights</h2>
            <div id="insightsContainer">
                <div class="loading">Loading insights...</div>
            </div>
        </div>
    </div>

    <script>
        // Global charts object
        let charts = {};

        // Load analytics data
        async function loadAnalytics() {
            try {
                const timeRange = document.getElementById('timeRange').value;
                
                // Fetch orders
                const ordersRes = await fetch('api/orders.php');
                const ordersData = await ordersRes.json();
                
                // Fetch products
                const productsRes = await fetch('api/products.php');
                const productsData = await productsRes.json();
                
                // Fetch clients
                const clientsRes = await fetch('api/clients.php');
                const clientsData = await clientsRes.json();

                if (ordersData.success && productsData.success && clientsData.success) {
                    processAnalytics(ordersData.data, productsData.data, clientsData.data, timeRange);
                }
            } catch (error) {
                console.error('Error loading analytics:', error);
            }
        }

        function processAnalytics(orders, products, clients, timeRange) {
            // Filter orders by time range
            const filteredOrders = filterByTimeRange(orders, timeRange);
            
            // Update stats
            document.getElementById('totalOrders').textContent = filteredOrders.length;
            const fulfilled = filteredOrders.filter(o => o.status === 'Fulfilled').length;
            document.getElementById('fulfilledOrders').textContent = fulfilled;
            document.getElementById('activeClients').textContent = clients.length;
            
            // Calculate changes (placeholder)
            document.getElementById('ordersChange').textContent = '↑ 12% from last period';
            document.getElementById('fulfilledChange').textContent = '↑ 8% from last period';
            document.getElementById('clientsChange').textContent = '↑ 5 new this week';

            // Create charts
            createOrderTrendsChart(filteredOrders);
            createStatusChart(filteredOrders);
            createProductsChart(filteredOrders, products);
            createClientsChart(filteredOrders, clients);
            
            // Generate insights
            generateInsights(filteredOrders, products, clients);
        }

        function filterByTimeRange(orders, range) {
            const now = new Date();
            const filtered = orders.filter(order => {
                const orderDate = new Date(order.created_at);
                
                switch(range) {
                    case 'today':
                        return orderDate.toDateString() === now.toDateString();
                    case 'week':
                        const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
                        return orderDate >= weekAgo;
                    case 'month':
                        const monthAgo = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
                        return orderDate >= monthAgo;
                    case 'year':
                        const yearAgo = new Date(now.getTime() - 365 * 24 * 60 * 60 * 1000);
                        return orderDate >= yearAgo;
                    default:
                        return true;
                }
            });
            
            return filtered;
        }

        function createOrderTrendsChart(orders) {
            const ctx = document.getElementById('orderTrendsChart');
            
            // Group orders by date
            const ordersByDate = {};
            orders.forEach(order => {
                const date = new Date(order.created_at).toLocaleDateString();
                ordersByDate[date] = (ordersByDate[date] || 0) + 1;
            });

            const dates = Object.keys(ordersByDate).sort();
            const counts = dates.map(date => ordersByDate[date]);

            if (charts.orderTrends) charts.orderTrends.destroy();
            
            charts.orderTrends = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: dates,
                    datasets: [{
                        label: 'Orders',
                        data: counts,
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            display: false
                        }
                    }
                }
            });
        }

        function createStatusChart(orders) {
            const ctx = document.getElementById('statusChart');
            
            // Count by status
            const statusCounts = {};
            orders.forEach(order => {
                const status = order.status || 'Unknown';
                statusCounts[status] = (statusCounts[status] || 0) + 1;
            });

            if (charts.status) charts.status.destroy();

            charts.status = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(statusCounts),
                    datasets: [{
                        data: Object.values(statusCounts),
                        backgroundColor: [
                            '#667eea',
                            '#764ba2',
                            '#f093fb',
                            '#f5576c',
                            '#4facfe',
                            '#00f2fe',
                            '#11998e',
                            '#38ef7d'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });
        }

        function createProductsChart(orders, products) {
            const ctx = document.getElementById('productsChart');
            
            // Count product occurrences in orders
            const productCounts = {};
            orders.forEach(order => {
                if (order.products) {
                    const productNames = order.products.split(', ');
                    productNames.forEach(name => {
                        productCounts[name] = (productCounts[name] || 0) + 1;
                    });
                }
            });

            // Get top 10
            const sorted = Object.entries(productCounts)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 10);

            const labels = sorted.map(item => item[0]);
            const data = sorted.map(item => item[1]);

            // Update top products stat
            if (labels.length > 0) {
                document.getElementById('topProducts').textContent = labels[0];
                document.getElementById('productsChange').textContent = `${data[0]} orders`;
            }

            if (charts.products) charts.products.destroy();

            charts.products = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Orders',
                        data: data,
                        backgroundColor: 'rgba(102, 126, 234, 0.8)'
                    }]
                },
                options: {
                    responsive: true,
                    indexAxis: 'y',
                    plugins: {
                        legend: {
                            display: false
                        }
                    }
                }
            });
        }

        function createClientsChart(orders, clients) {
            const ctx = document.getElementById('clientsChart');
            
            // Count orders per client
            const clientOrders = {};
            orders.forEach(order => {
                const client = order.client_name || 'Unknown';
                clientOrders[client] = (clientOrders[client] || 0) + 1;
            });

            // Get top 10 clients
            const sorted = Object.entries(clientOrders)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 10);

            const labels = sorted.map(item => item[0]);
            const data = sorted.map(item => item[1]);

            if (charts.clients) charts.clients.destroy();

            charts.clients = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Orders',
                        data: data,
                        backgroundColor: 'rgba(56, 239, 125, 0.8)'
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            display: false
                        }
                    }
                }
            });
        }

        function generateInsights(orders, products, clients) {
            const container = document.getElementById('insightsContainer');
            container.innerHTML = '';

            // Insight 1: Fulfillment rate
            const fulfilled = orders.filter(o => o.status === 'Fulfilled').length;
            const rate = orders.length > 0 ? ((fulfilled / orders.length) * 100).toFixed(1) : 0;
            
            let insight1 = `<div class="insight-item ${rate > 80 ? 'success' : rate > 50 ? '' : 'warning'}">
                <strong>Fulfillment Rate:</strong> ${rate}% of orders have been fulfilled.
                ${rate < 80 ? 'Consider reviewing pending orders to improve efficiency.' : 'Great job! Keep up the excellent work.'}
            </div>`;
            container.innerHTML += insight1;

            // Insight 2: Active clients
            const activeClients = new Set(orders.map(o => o.client_name)).size;
            let insight2 = `<div class="insight-item">
                <strong>Client Engagement:</strong> ${activeClients} clients have placed orders recently.
                ${activeClients < clients.length / 2 ? 'Consider reaching out to inactive clients.' : ''}
            </div>`;
            container.innerHTML += insight2;

            // Insight 3: Product diversity
            const uniqueProducts = new Set();
            orders.forEach(order => {
                if (order.products) {
                    order.products.split(', ').forEach(p => uniqueProducts.add(p));
                }
            });
            
            let insight3 = `<div class="insight-item">
                <strong>Product Diversity:</strong> ${uniqueProducts.size} different products ordered out of ${products.length} available.
                ${uniqueProducts.size < products.length / 2 ? 'Some products may need promotion.' : ''}
            </div>`;
            container.innerHTML += insight3;

            // Insight 4: Recent activity
            const recentOrders = orders.filter(o => {
                const orderDate = new Date(o.created_at);
                const dayAgo = new Date(Date.now() - 24 * 60 * 60 * 1000);
                return orderDate >= dayAgo;
            });
            
            let insight4 = `<div class="insight-item ${recentOrders.length > 5 ? 'success' : ''}">
                <strong>Recent Activity:</strong> ${recentOrders.length} orders in the last 24 hours.
            </div>`;
            container.innerHTML += insight4;
        }

        function exportReport() {
            // Generate CSV report
            const timeRange = document.getElementById('timeRange').value;
            const filename = `tweakorder-report-${timeRange}-${new Date().toISOString().split('T')[0]}.csv`;
            
            // For now, show alert
            alert(`Export functionality coming soon!\n\nReport will be saved as: ${filename}\n\nWill include:\n- Order summary\n- Product performance\n- Client activity\n- Key metrics`);
            
            // TODO: Implement actual CSV export
        }

        // Event listeners
        document.getElementById('timeRange').addEventListener('change', loadAnalytics);
        document.getElementById('startDate').addEventListener('change', loadAnalytics);
        document.getElementById('endDate').addEventListener('change', loadAnalytics);

        // Initial load
        loadAnalytics();
    </script>
</body>
</html>
