<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard - Tweak Order Online</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .user-avatar {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 20px;
        }
        
        .order-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }
        
        .stat-card h3 {
            color: white;
            font-size: 2em;
            margin-bottom: 5px;
        }
        
        .stat-card p {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
            flex-wrap: wrap;
        }
        
        .tab {
            padding: 12px 20px;
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            color: #999;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
        }
        
        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        
        .order-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }
        
        .order-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }
        
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .order-id {
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
        }
        
        .order-status {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .status-processing { background: #ffd93d; color: #000; }
        .status-accepted { background: #6bcf7f; color: white; }
        .status-waiting_for_supplies { background: #ff6b6b; color: white; }
        .status-waiting_for_customer { background: #ffa502; color: white; }
        .status-ready_for_pickup { background: #4834df; color: white; }
        .status-ready_for_dropoff { background: #0abde3; color: white; }
        .status-fulfilled { background: #26de81; color: white; }
        .status-cancelled { background: #95a5a6; color: white; }
        
        .order-items {
            margin-top: 10px;
        }
        
        .order-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .order-item:last-child {
            border-bottom: none;
        }
        
        .order-date {
            color: #999;
            font-size: 13px;
            margin-top: 10px;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        
        .empty-state h3 {
            color: #667eea;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="dashboard-header">
            <div class="user-info">
                <div class="user-avatar" id="userAvatar"></div>
                <div>
                    <h2 style="margin: 0;" id="userName">Welcome</h2>
                    <p style="margin: 0; color: #999; font-size: 14px;" id="userUsername"></p>
                </div>
            </div>
            <div>
                <button class="btn btn-primary" onclick="navigateTo('client-order.html')" style="margin-right: 10px;">+ New Order</button>
                <button class="btn btn-secondary" onclick="logout()">Logout</button>
            </div>
        </div>
        
        <div class="order-stats">
            <div class="stat-card">
                <h3 id="totalOrders">0</h3>
                <p>Total Orders</p>
            </div>
            <div class="stat-card" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
                <h3 id="activeOrders">0</h3>
                <p>Active Orders</p>
            </div>
            <div class="stat-card" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
                <h3 id="completedOrders">0</h3>
                <p>Completed Orders</p>
            </div>
        </div>
        
        <div class="tabs">
            <button class="tab active" onclick="showOrderTab('all')">All Orders</button>
            <button class="tab" onclick="showOrderTab('current')">Current Orders</button>
            <button class="tab" onclick="showOrderTab('completed')">Completed</button>
        </div>
        
        <div id="allOrders" class="tab-content active">
            <div id="allOrdersList"></div>
        </div>
        
        <div id="currentOrders" class="tab-content">
            <div id="currentOrdersList"></div>
        </div>
        
        <div id="completedOrders" class="tab-content">
            <div id="completedOrdersList"></div>
        </div>
    </div>
    
    <script src="assets/js/app.js"></script>
    <script>
        let clientData = null;
        let allOrdersData = [];
        
        // Check authentication
        function checkAuth() {
            ajax('api/auth.php', 'GET', null, function(err, response) {
                if (err || !response.success || !response.logged_in) {
                    window.location.href = 'client-portal.html';
                    return;
                }
                
                clientData = response;
                initDashboard();
            });
        }
        
        // Initialize dashboard
        function initDashboard() {
            // Set user info
            document.getElementById('userName').textContent = 'Welcome, ' + clientData.name;
            document.getElementById('userUsername').textContent = clientData.username;
            
            // Set avatar initial
            const initials = clientData.name.split(' ').map(n => n[0]).join('').toUpperCase();
            document.getElementById('userAvatar').textContent = initials;
            
            // Load orders
            loadOrders();
        }
        
        // Load orders
        function loadOrders() {
            ajax('api/client-orders.php', 'GET', null, function(err, response) {
                if (err || !response.success) {
                    showAlert('Failed to load orders', 'error');
                    return;
                }
                
                allOrdersData = response.data;
                updateStats();
                displayOrders();
            });
        }
        
        // Update statistics
        function updateStats() {
            const total = allOrdersData.length;
            const active = allOrdersData.filter(o => 
                o.status !== 'fulfilled' && o.status !== 'cancelled'
            ).length;
            const completed = allOrdersData.filter(o => o.status === 'fulfilled').length;
            
            document.getElementById('totalOrders').textContent = total;
            document.getElementById('activeOrders').textContent = active;
            document.getElementById('completedOrders').textContent = completed;
        }
        
        // Display orders
        function displayOrders() {
            const all = allOrdersData;
            const current = allOrdersData.filter(o => 
                o.status !== 'fulfilled' && o.status !== 'cancelled'
            );
            const completed = allOrdersData.filter(o => o.status === 'fulfilled');
            
            document.getElementById('allOrdersList').innerHTML = renderOrdersList(all);
            document.getElementById('currentOrdersList').innerHTML = renderOrdersList(current);
            document.getElementById('completedOrdersList').innerHTML = renderOrdersList(completed);
        }
        
        // Render orders list
        function renderOrdersList(orders) {
            if (orders.length === 0) {
                return `
                    <div class="empty-state">
                        <h3>No orders found</h3>
                        <p>You haven't placed any orders yet.</p>
                        <button class="btn btn-primary" onclick="navigateTo('client-order.html')" style="margin-top: 20px;">Place Your First Order</button>
                    </div>
                `;
            }
            
            return orders.map(order => `
                <div class="order-card">
                    <div class="order-header">
                        <div class="order-id">Order #${order.id}</div>
                        <div class="order-status status-${order.status}">${formatStatus(order.status)}</div>
                    </div>
                    <div class="order-items">
                        ${order.items.map(item => `
                            <div class="order-item">
                                <span><strong>${item.name}</strong></span>
                                <span>Qty: ${item.quantity}</span>
                            </div>
                        `).join('')}
                    </div>
                    ${order.pickup_or_dropoff ? `
                        <div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid #f0f0f0;">
                            <strong>Type:</strong> ${order.pickup_or_dropoff === 'pickup' ? 'Pickup' : 'Dropoff'}
                            ${order.scheduled_time ? ` | <strong>Scheduled:</strong> ${formatDate(order.scheduled_time)}` : ''}
                        </div>
                    ` : ''}
                    ${order.other_instructions ? `
                        <div style="margin-top: 10px; padding: 10px; background: #f8f9fa; border-radius: 8px;">
                            <strong>Instructions:</strong> ${order.other_instructions}
                        </div>
                    ` : ''}
                    <div class="order-date">
                        Created: ${formatDate(order.created_at)}
                        ${order.updated_at !== order.created_at ? ` | Updated: ${formatDate(order.updated_at)}` : ''}
                    </div>
                </div>
            `).join('');
        }
        
        // Format status for display
        function formatStatus(status) {
            return status.replace(/_/g, ' ');
        }
        
        // Show order tab
        function showOrderTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            event.target.classList.add('active');
            
            if (tab === 'all') {
                document.getElementById('allOrders').classList.add('active');
            } else if (tab === 'current') {
                document.getElementById('currentOrders').classList.add('active');
            } else if (tab === 'completed') {
                document.getElementById('completedOrders').classList.add('active');
            }
        }
        
        // Logout
        function logout() {
            const formData = new URLSearchParams();
            formData.append('action', 'logout');
            
            ajax('api/auth.php', 'POST', formData.toString(), function(err, response) {
                window.location.href = 'client-portal.html';
            });
        }
        
        // Initialize on page load
        checkAuth();
    </script>
</body>
</html>
